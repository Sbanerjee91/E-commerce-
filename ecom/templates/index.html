{% extends 'menu.html' %}
{% block content %}
{% load static %}

<style>
.pro-img{
    width:100%;
    height:187px;
    object-fit:cover;
    border-radius:10px;
}
.cart{
    cursor:pointer;
}
</style>

<script>
function addtocart(name, price){

    var cart = JSON.parse(localStorage.getItem("cart")) || [];

    // check if product already exists
    var existing = cart.find(item => item.name === name);

    if(existing){
        existing.quantity += 1;
    } else {
        cart.push({
            name: name,
            price: price,
            quantity: 1
        });
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("✅ Added to Cart");
}
</script>

<div class="container mt-4">
    <div class="row">

        {% for Product in pr %}
        <div class="col-lg-4">

            <div class="card shadow-sm" style="width: 18rem;">
                
                <!-- IMAGE -->
                <img src="{% static 'watch.jpg' %}" class="card-img-top pro-img" alt="...">

                <div class="card-body">
                    
                    <!-- NAME -->
                    <h5 class="card-title">{{ Product.name }}</h5>

                    <!-- DESCRIPTION -->
                    <p class="card-text pb-2">{{ Product.description }}</p>

                    <!-- PRICE -->
                    <h5>₹{{ Product.price }}</h5>

                    <!-- BUTTONS -->
                    <a href="#" class="btn btn-primary"
                    onclick="addtocart('{{ Product.name }}','{{ Product.price }}')">
                    Add to Cart
                    </a>

                    <a href="#" class="btn btn-success">Buy Now</a>

                </div>
            </div>
            <br>

        </div>
        {% endfor %}

    </div>
</div>

{% endblock %}
