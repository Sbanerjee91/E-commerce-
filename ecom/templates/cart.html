{% extends 'menu.html' %}

{% block content %}

<style>
img{
width:60px;
height:60px;
object-fit:cover;
border-radius:5px;
}
</style>

<div class="container mt-5">

<h2 class="mb-4">Shopping Cart</h2>

<table class="table table-bordered">

<thead>
<tr class="text-center">
<th>Name</th>
<th>Price</th>
<th>Quantity</th>
<th>Action</th> <!-- FIXED -->
</tr>
</thead>

<tbody id="cartdata" class="text-center">

</tbody>

</table>

</div>

<a href="/" class="btn btn-primary ms-3">Continue Shopping</a>
<a href="/check" class="btn btn-outline-danger ms-3">Checkout</a>

<script>

function displaycart(){
    var cart = JSON.parse(localStorage.getItem("cart")) || [];
    var html = "";

    if(cart.length === 0){
        html = `<tr><td colspan="4">Cart is empty</td></tr>`;
    }

    cart.forEach(function(item,index){
        html += `
        <tr>
            <td>${item.name || item.title || "No Name"}</td> <!-- FIXED -->
            <td>₹${item.price}</td>
            <td>
                <button onclick="decqty(${index})" class="btn btn-sm btn-secondary">-</button> 
                ${item.quantity || 1}
                <button onclick="incqty(${index})" class="btn btn-sm btn-secondary">+</button>
            </td>
            <td>
                <button onclick="removeitem(${index})" class="btn btn-outline-danger">❌</button>
            </td>
        </tr>
        `;
    });

    document.getElementById("cartdata").innerHTML = html;
}

function incqty(index){
    var cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart[index].quantity = (cart[index].quantity || 1) + 1;

    localStorage.setItem("cart", JSON.stringify(cart));
    displaycart();
}

function decqty(index){
    var cart = JSON.parse(localStorage.getItem("cart")) || [];

    if(cart[index].quantity > 1){  // FIXED (no negative)
        cart[index].quantity -= 1;
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    displaycart();
}

function removeitem(index){
    var cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index,1);

    localStorage.setItem("cart", JSON.stringify(cart));
    displaycart();
}

window.onload = displaycart;

</script>

{% endblock %}
